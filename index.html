<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白噪音 · iPod 播放器</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:transparent;
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
  }

  /* ===== iPod 外壳 ===== */
  .ipod{
    width:340px; padding:22px 22px 26px; border-radius:26px;
    background:linear-gradient(160deg,#fdfdfd,#cfd4da);
    box-shadow:0 30px 70px rgba(0,0,0,.45), inset 0 1px 0 #fff, inset 0 -2px 6px rgba(0,0,0,.12);
  }

  /* ===== 屏幕 ===== */
  .bezel{ background:#000; border-radius:12px; padding:10px; box-shadow:inset 0 0 0 2px #2a2a2a, inset 0 3px 10px rgba(0,0,0,.6); }
  .screen{ position:relative; width:100%; aspect-ratio:4/3; background:#0b0e13; border-radius:5px; overflow:hidden; }

  /* 菜单视图 */
  .menu{ position:absolute; inset:0; background:linear-gradient(#eef3ff,#dbe6ff); color:#1b2a4a; display:flex; flex-direction:column; }
  .menu .bar{ background:linear-gradient(#5b8cff,#3a6df0); color:#fff; font-size:13px; font-weight:700; padding:5px 10px; display:flex; justify-content:space-between; }
  .menu .bar .cnt{ opacity:.85; font-weight:500; }
  .viewport{ position:relative; flex:1; overflow:hidden; }
  .list{ position:absolute; left:0; right:0; top:0; transition:transform .18s ease; }
  .row{ height:34px; display:flex; align-items:center; padding:0 12px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-bottom:1px solid rgba(0,0,0,.04); }
  .row .ico{ margin-right:8px; }
  .row.on{ background:linear-gradient(90deg,#3a6df0,#5b8cff); color:#fff; }

  /* 正在播放视图 */
  .nowplaying{ position:absolute; inset:0; background:#000; display:none; }
  .nowplaying.show{ display:block; }
  #player{ width:100%; height:100%; border:0; display:block; }
  .np-title{ position:absolute; top:0; left:0; right:0; padding:6px 10px; font-size:12px; color:#fff;
             background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 玻璃反光 */
  .screen::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 40%); border-radius:5px; }

  /* ===== 点击转盘 ===== */
  .wheel{ position:relative; width:206px; height:206px; margin:24px auto 0; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #f6f7f9, #c4c9cf);
    box-shadow: inset 0 2px 6px rgba(255,255,255,.9), inset 0 -4px 10px rgba(0,0,0,.25), 0 4px 12px rgba(0,0,0,.22);
    touch-action:none; user-select:none; }
  .wheel .center{ position:absolute; inset:0; margin:auto; width:76px; height:76px; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #fbfcfd, #d2d7dd);
    box-shadow: inset 0 1px 3px #fff, 0 2px 6px rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; }
  .wheel .center span{ font-size:11px; color:#6b7280; font-weight:700; letter-spacing:1px; }
  .lbl{ position:absolute; font-size:11px; color:#5b6270; font-weight:700; letter-spacing:.5px; cursor:pointer; }
  .lbl.menu{ top:10px; left:50%; transform:translateX(-50%); }
  .lbl.prev{ left:14px; top:50%; transform:translateY(-50%); }
  .lbl.next{ right:14px; top:50%; transform:translateY(-50%); }

  .hint{ margin:16px auto 0; max-width:340px; font-size:11px; color:rgba(70,80,100,.75); line-height:1.7; text-align:center; }
</style>
</head>
<body>

  <div class="ipod">
    <div class="bezel">
      <div class="screen" id="screen">
        <!-- 菜单 -->
        <div class="menu" id="menu">
          <div class="bar"><span>白噪音</span><span class="cnt" id="cnt"></span></div>
          <div class="viewport"><div class="list" id="list"></div></div>
        </div>
        <!-- 正在播放 -->
        <div class="nowplaying" id="np">
          <div class="np-title" id="npTitle">—</div>
          <iframe id="player" src="" scrolling="no" frameborder="no" allow="autoplay; encrypted-media; fullscreen"></iframe>
        </div>
      </div>
    </div>

    <div class="wheel" id="wheel">
      <div class="lbl menu" id="btnMenu">MENU</div>
      <div class="lbl prev" id="btnPrev">◀</div>
      <div class="lbl next" id="btnNext">▶</div>
      <div class="center" id="btnCenter"><span>SELECT</span></div>
    </div>
  </div>

  <div class="hint">
    转盘上／下滑动选曲，按中心 SELECT 播放（屏幕出画面）；MENU 返回列表。<br>
    播放／暂停／音量请用画面内的 B 站控件。编辑文件顶部 TRACKS 数组增删白噪音。<br>
    部署到 GitHub Pages / Vercel / Netlify 后，在 Notion 用 <b>/embed</b> 粘贴本页地址即可。
  </div>

<script>
/* ===================== 在这里编辑你的白噪音列表 =====================
   把 bvid 换成目标 B 站视频的 BV 号（视频页地址里 "BVxxxx" 那段）。
   想加几首就加几首，顺序即播放列表顺序。 */
const TRACKS = [
  { title: "雨声·木鱼 又见净慈寺", bvid: "BV14y4y1h7FG" },
  { title: "示例 · 咖啡馆环境音", bvid: "BV1xx411c7mE" },
  { title: "示例 · lo-fi 放松",   bvid: "BV1xx411c7mF" },
  { title: "示例 · 壁炉白噪音",   bvid: "BV1xx411c7mG" },
];

const player = document.getElementById('player');
const menuEl = document.getElementById('menu');
const npEl   = document.getElementById('np');
const listEl = document.getElementById('list');
const npTitle= document.getElementById('npTitle');
const cntEl  = document.getElementById('cnt');
const screenEl = document.getElementById('screen');

let sel = 0;        // 菜单高亮项
let current = 0;    // 正在播放项
let view = 'menu';  // 'menu' | 'nowplaying'

function buildSrc(bvid){
  return `https://player.bilibili.com/player.html?bvid=${bvid}` +
         `&page=1&danmaku=0&high_quality=1&autoplay=1`;
}

// 渲染列表
TRACKS.forEach((t, i) => {
  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = `<span class="ico">♪</span><span>${t.title}</span>`;
  listEl.appendChild(r);
});
cntEl.textContent = TRACKS.length + " 首";

const ITEM_H = 34;
function renderMenu(){
  const h = screenEl.clientHeight;
  const offset = (h/2 - ITEM_H/2) - sel * ITEM_H;
  listEl.style.transform = `translateY(${offset}px)`;
  [...listEl.children].forEach((el, i) => el.classList.toggle('on', i === sel));
}

function enterNowPlaying(i){
  current = (i + TRACKS.length) % TRACKS.length;
  const t = TRACKS[current];
  npTitle.textContent = "♪ " + t.title;
  player.src = buildSrc(t.bvid);   // 用户手势触发，autoplay 通常可出声
  menuEl.style.display = 'none';
  npEl.classList.add('show');
  view = 'nowplaying';
}

function enterMenu(){
  npEl.classList.remove('show');
  player.src = '';                 // 停掉音频（回到列表即停止）
  menuEl.style.display = 'flex';
  view = 'menu';
  renderMenu();
}

function moveSel(d){
  sel = (sel + d + TRACKS.length) % TRACKS.length;
  renderMenu();
}

/* ---- 转盘：拖动旋转选曲 ---- */
const wheel = document.getElementById('wheel');
let lastA = null, accum = 0;
const STEP = Math.PI / 12; // 每 15° 移动一格

function angleAt(e){
  const r = wheel.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2));
}
wheel.addEventListener('pointerdown', e => {
  if (e.target.id === 'btnCenter') return;
  wheel.setPointerCapture(e.pointerId);
  lastA = angleAt(e); accum = 0;
});
wheel.addEventListener('pointermove', e => {
  if (lastA === null) return;
  const a = angleAt(e);
  let d = a - lastA;
  if (d >  Math.PI) d -= 2*Math.PI;
  if (d < -Math.PI) d += 2*Math.PI;
  accum += d; lastA = a;
  while (accum >  STEP){ accum -= STEP; view==='menu' ? moveSel(1)  : enterNowPlaying(current+1); }
  while (accum < -STEP){ accum += STEP; view==='menu' ? moveSel(-1) : enterNowPlaying(current-1); }
});
wheel.addEventListener('pointerup',   () => lastA = null);
wheel.addEventListener('pointercancel',()=> lastA = null);

/* ---- 方向键 / 按钮 ---- */
document.getElementById('btnCenter').onclick = () => {
  if (view === 'menu') enterNowPlaying(sel);
  else enterMenu();
};
document.getElementById('btnMenu').onclick  = () => { if (view==='nowplaying') enterMenu(); else moveSel(-1); };
document.getElementById('btnPrev').onclick  = () => { view==='menu' ? moveSel(-1) : enterNowPlaying(current-1); };
document.getElementById('btnNext').onclick  = () => { view==='menu' ? moveSel(1)  : enterNowPlaying(current+1); };

/* ---- 键盘（方便桌面预览） ---- */
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')   { view==='menu'?moveSel(-1):enterNowPlaying(current-1); }
  else if (e.key === 'ArrowDown'){ view==='menu'?moveSel(1):enterNowPlaying(current+1); }
  else if (e.key === 'Enter'){ view==='menu'?enterNowPlaying(sel):enterMenu(); }
  else if (e.key === 'Escape'){ if(view==='nowplaying') enterMenu(); }
});

/* ---- 深链 ?t=序号 直接进正在播放 ---- */
const p = new URLSearchParams(location.search);
if (p.get('t')) { sel = (+p.get('t')||0) % TRACKS.length; }
renderMenu();
</script>
</body>
</html>
